<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>小说上传（自动触发 GitHub Actions）</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<style>
  body { font-family: "Noto Serif SC", serif; background:#f7f7f8; margin:0; padding:24px; color:#222;}
  .card { max-width:900px; margin:24px auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,0.06); }
  h1 { color:#b83030; margin:0 0 10px; }
  label { display:block; margin-top:12px; font-weight:600; }
  input[type="text"], textarea { width:100%; padding:10px; box-sizing:border-box; border-radius:6px; border:1px solid #ddd; font-size:14px; }
  textarea { min-height:110px; resize:vertical; }
  .files { margin-top:10px; }
  .file-item { display:flex; justify-content:space-between; gap:12px; align-items:center; padding:8px 10px; border-radius:6px; background:#fafafa; border:1px solid #eee; margin-bottom:8px;}
  button { background:#b83030; color:#fff; border:0; padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:700; }
  button:disabled { opacity:0.5; cursor:not-allowed; }
  .status { margin-top:14px; padding:10px; border-radius:8px; display:none; }
  .status.success { background:#e6f4ea; color:#1f6a2b; border:1px solid #cfe8d2; display:block; }
  .status.error { background:#fde7e8; color:#8b1f26; border:1px solid #f1c6c8; display:block; }
  .note { margin-top:12px; font-size:13px; color:#666; }
  .small { font-size:13px; color:#666; }
  .progress-bar { height:8px; background:#eee; border-radius:6px; overflow:hidden; margin-top:8px; }
  .progress { height:100%; width:0%; background:#b83030; transition:width 300ms linear;}
</style>
</head>
<body>
  <div class="card">
    <h1><i class="fas fa-cloud-upload-alt"></i> 小说上传并触发自动处理</h1>
    <p class="small">填写小说元数据（标题/作者/标签/简介），并上传 Markdown 章节文件。上传后文件会写入 <code>uploads/pending/</code>，从而触发仓库中的 `process-upload` workflow。</p>

    <label>小说标题 *</label>
    <input id="novelTitle" type="text" placeholder="例如：我的奇幻冒险">

    <label>作者 *</label>
    <input id="novelAuthor" type="text" placeholder="作者名">

    <label>标签（逗号分隔） *</label>
    <input id="novelTags" type="text" placeholder="例如：玄幻, 冒险">

    <label>小说简介 *</label>
    <textarea id="novelDescription" placeholder="一句话或几句简介，建议 50 字以上"></textarea>

    <label style="margin-top:14px">选择章节文件（.md，可多选） *</label>
    <input id="fileInput" type="file" accept=".md" multiple />

    <div id="fileList" class="files"></div>

    <div style="margin-top:12px">
      <button id="startUpload">开始上传并触发处理</button>
      <span style="margin-left:12px" class="small">（注意：示例中 token 在前端，仅供测试。生产请隐藏密钥）</span>
    </div>

    <div id="progressContainer" style="display:none; margin-top:12px;">
      <div class="progress-bar"><div id="progress" class="progress"></div></div>
      <div id="progressText" class="small" style="margin-top:6px"></div>
    </div>

    <div id="status" class="status"></div>

  </div>

<script>
(() => {
  // ====== 配置项（请按需修改） ======
  const OWNER = "awealy";      // 仓库拥有者
  const REPO  = "new_novels";  // 仓库名
  const BRANCH = "main";       // 目标分支
  // ====== 注意：为方便测试先放这里，生产请隐藏 ======
  let TOKEN = "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"; // <- 把你的 Personal Access Token 粘贴到这里，或用 prompt() 在测试时输入

  // ========================= UI 元素 =========================
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const startBtn = document.getElementById('startUpload');
  const statusBox = document.getElementById('status');
  const progressBar = document.getElementById('progress');
  const progressContainer = document.getElementById('progressContainer');
  const progressText = document.getElementById('progressText');

  let selectedFiles = [];

  function slugify(s) {
    return s.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g,'-').replace(/^-+|-+$/g,'').substring(0,60);
  }

  fileInput.addEventListener('change', (e) => {
    selectedFiles = Array.from(e.target.files).filter(f => f.name.endsWith('.md'));
    renderFileList();
  });

  function renderFileList() {
    fileList.innerHTML = '';
    if (selectedFiles.length === 0) {
      fileList.innerHTML = '<div class="small">未选择文件</div>';
      return;
    }
    selectedFiles.forEach(f => {
      const div = document.createElement('div');
      div.className = 'file-item';
      div.innerHTML = `<div style="flex:1"><strong>${f.name}</strong><div class="small">${Math.round(f.size/1024)} KB</div></div>
                       <div style="min-width:160px;text-align:right"><button onclick="removeFile('${f.name}')">移除</button></div>`;
      fileList.appendChild(div);
    });
    // expose removeFile globally for onclick
    window.removeFile = (name) => {
      selectedFiles = selectedFiles.filter(x => x.name !== name);
      renderFileList();
    };
  }

  function showStatus(msg, type='') {
    statusBox.style.display = 'block';
    statusBox.innerHTML = msg;
    statusBox.className = 'status' + (type ? ' ' + type : '');
  }

  function hideStatus() {
    statusBox.style.display = 'none';
    statusBox.innerHTML = '';
  }

  async function promptTokenIfEmpty() {
    if (!TOKEN) {
      TOKEN = prompt("请输入 GitHub Personal Access Token (仅用于测试)：");
    }
    return !!TOKEN;
  }

  async function uploadFileToRepo(path, contentStr, commitMessage) {
    // contentStr 已是普通文本，需 base64 encode（UTF-8）
    const encoded = btoa(unescape(encodeURIComponent(contentStr)));
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(path)}`;
    const body = {
      message: commitMessage,
      content: encoded,
      branch: BRANCH
    };
    const resp = await fetch(url, {
      method: 'PUT',
      headers: {
        Authorization: `Bearer ${TOKEN}`,
        'Content-Type': 'application/json',
        Accept: 'application/vnd.github.v3+json'
      },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    if (!resp.ok) {
      const errMsg = data && data.message ? data.message : `HTTP ${resp.status}`;
      throw new Error(errMsg);
    }
    return data;
  }

  // 主上传流程
  startBtn.addEventListener('click', async () => {
    hideStatus();
    const title = document.getElementById('novelTitle').value.trim();
    const author = document.getElementById('novelAuthor').value.trim();
    const tags = document.getElementById('novelTags').value.trim();
    const desc = document.getElementById('novelDescription').value.trim();

    if (!title || !author || !tags || !desc) {
      showStatus('请填写标题、作者、标签与简介，并选择至少一个 .md 文件', 'error');
      return;
    }
    if (!selectedFiles.length) {
      showStatus('请选择至少一个 .md 文件', 'error');
      return;
    }

    if (!(await promptTokenIfEmpty())) {
      showStatus('未填写 token，取消上传', 'error');
      return;
    }

    startBtn.disabled = true;
    progressContainer.style.display = 'block';
    progressBar.style.width = '0%';
    progressText.textContent = '';

    const timestamp = Date.now();
    const slug = slugify(title);
    const folder = `uploads/pending/${timestamp}_${slug}`;
    const metadata = {
      title,
      author,
      tags: tags.split(',').map(t => t.trim()).filter(Boolean),
      description: desc,
      uploadTime: new Date().toISOString()
    };

    try {
      // 1. 上传 metadata.json
      progressText.textContent = `上传 metadata.json 到 ${folder}/metadata.json`;
      progressBar.style.width = '6%';
      await uploadFileToRepo(`${folder}/metadata.json`, JSON.stringify(metadata, null, 2), `upload: metadata ${title}`);
      progressBar.style.width = '18%';

      // 2. 逐个上传章节文件
      for (let i = 0; i < selectedFiles.length; i++) {
        const f = selectedFiles[i];
        progressText.textContent = `上传 ${f.name} (${i+1}/${selectedFiles.length})`;
        // 读取文件文本
        const content = await f.text();
        // 上传为原始文件名（保留用户上传文件名）
        const path = `${folder}/${f.name}`;
        await uploadFileToRepo(path, content, `upload: ${f.name} (${title})`);
        // 更新进度
        const pct = 18 + Math.round((i + 1) / selectedFiles.length * 76);
        progressBar.style.width = `${pct}%`;
      }

      progressText.textContent = `已全部上传，触发 GitHub Actions 处理中...`;
      progressBar.style.width = `100%`;
      showStatus('✅ 上传成功 — 已把文件写入仓库 uploads/pending/ 下。GitHub Actions 应该很快开始处理。', 'success');

    } catch (err) {
      console.error(err);
      showStatus('上传失败：' + err.message, 'error');
    } finally {
      startBtn.disabled = false;
    }
  });

})();
</script>
</body>
</html>
