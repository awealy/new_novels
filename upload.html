<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上传小说 - 自动触发部署</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body { font-family: "Noto Serif SC", serif; background:#fafafa; padding:2rem; }
.container { max-width:700px; margin:auto; background:white; padding:2rem; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
h1 { color:#c33; text-align:center; }
button { background:#c33; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer; }
.status { margin-top:1rem; padding:1rem; border-radius:5px; }
.success { background:#d4edda; color:#155724; }
.error { background:#f8d7da; color:#721c24; }
</style>
</head>
<body>
<div class="container">
  <h1><i class="fas fa-cloud-upload-alt"></i> 小说上传</h1>
  <p>上传 Markdown 文件，将自动触发 GitHub Actions 处理</p>

  <label>小说标题：</label>
  <input id="title" type="text" style="width:100%;padding:8px;margin-bottom:10px" placeholder="请输入标题">

  <label>作者：</label>
  <input id="author" type="text" style="width:100%;padding:8px;margin-bottom:10px" placeholder="请输入作者">

  <label>上传章节文件（.md）：</label>
  <input id="fileInput" type="file" accept=".md" multiple style="margin-bottom:10px">

  <button id="uploadBtn">上传并触发部署</button>
  <div id="status" class="status"></div>
</div>

<script>
const uploadBtn = document.getElementById("uploadBtn");
uploadBtn.addEventListener("click", async () => {
  const files = document.getElementById("fileInput").files;
  const title = document.getElementById("title").value.trim();
  const author = document.getElementById("author").value.trim();
  const status = document.getElementById("status");
  
  if (!title || !author || files.length === 0) {
    status.innerHTML = "❌ 请填写完整信息并选择文件";
    status.className = "status error";
    return;
  }

  // ⚠️ 你的 GitHub 仓库配置
  const owner = "awealy";
  const repo = "new_novels";
  const branch = "main";
  const token = "在这里粘贴你的Token"; // ⚠️仅测试用，正式部署前必须隐藏！

  status.innerHTML = "⏳ 正在上传文件...";
  status.className = "status";

  for (const file of files) {
    const content = await file.text();
    const encoded = btoa(unescape(encodeURIComponent(content)));
    const timestamp = Date.now();
    const path = `uploads/pending/${timestamp}_${file.name}`;

    const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
      method: "PUT",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `上传小说: ${file.name} (${title}) by ${author}`,
        content: encoded,
        branch
      })
    });

    const data = await response.json();
    if (response.ok) {
      status.innerHTML = `✅ 已上传 ${file.name}，GitHub Actions 将自动运行。`;
      status.className = "status success";
    } else {
      status.innerHTML = `❌ 上传失败: ${data.message}`;
      status.className = "status error";
      console.error(data);
      return;
    }
  }

  status.innerHTML += "<br>🚀 几分钟后页面将自动更新！";
});
</script>
</body>
</html>
