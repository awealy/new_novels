<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小说上传 - 彩凤书阁</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .upload-container {
            max-width: 800px;
            margin: 100px auto 50px;
            padding: 2rem;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: var(--shadow);
        }

        .upload-status {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 5px;
            display: none;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status-processing {
            background: #cce7ff;
            color: #004085;
            border: 1px solid #b3d7ff;
        }
    </style>
</head>
<body>
    <!-- 导航栏保持不变 -->
    <nav class="navbar">...</nav>

    <div class="upload-container">
        <h1>小说上传</h1>
        
        <div id="uploadStatus" class="upload-status"></div>
        
        <form id="uploadForm">
            <div class="form-group">
                <label>小说标题 *</label>
                <input type="text" id="novelTitle" required>
            </div>
            
            <div class="form-group">
                <label>作者 *</label>
                <input type="text" id="novelAuthor" required>
            </div>
            
            <div class="form-group">
                <label>小说简介 *</label>
                <textarea id="novelDescription" required></textarea>
            </div>
            
            <div class="form-group">
                <label>标签（用逗号分隔）*</label>
                <input type="text" id="novelTags" required>
            </div>
            
            <div class="form-group">
                <label>上传章节文件 *</label>
                <input type="file" id="chapterFiles" multiple accept=".md" required>
                <div id="fileList"></div>
            </div>
            
            <button type="submit" id="submitBtn">上传小说</button>
        </form>
    </div>

    <script>
        class EnhancedUploader {
            constructor() {
                this.form = document.getElementById('uploadForm');
                this.statusElement = document.getElementById('uploadStatus');
                this.init();
            }

            init() {
                this.form.addEventListener('submit', (e) => this.handleSubmit(e));
                this.setupFilePreview();
            }

            async handleSubmit(e) {
                e.preventDefault();
                this.showStatus('开始处理上传...', 'processing');
                
                try {
                    const formData = this.prepareFormData();
                    await this.uploadNovel(formData);
                    this.showStatus('上传成功！系统正在处理您的文件...', 'success');
                    this.form.reset();
                    
                    // 3秒后跳转到首页
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 3000);
                    
                } catch (error) {
                    this.showStatus(`上传失败: ${error.message}`, 'error');
                }
            }

            prepareFormData() {
                const formData = new FormData();
                const files = document.getElementById('chapterFiles').files;
                
                if (files.length === 0) {
                    throw new Error('请至少上传一个章节文件');
                }

                // 准备元数据
                const metadata = {
                    title: document.getElementById('novelTitle').value,
                    author: document.getElementById('novelAuthor').value,
                    description: document.getElementById('novelDescription').value,
                    tags: document.getElementById('novelTags').value.split(',').map(tag => tag.trim()),
                    timestamp: new Date().toISOString()
                };

                formData.append('metadata', JSON.stringify(metadata));
                
                // 添加文件
                for (let file of files) {
                    formData.append('chapters', file);
                }

                return formData;
            }

            async uploadNovel(formData) {
                // 这里应该是实际的上传端点
                // 由于GitHub Pages是静态托管，我们使用GitHub API直接提交
                await this.submitViaGitHubAPI(formData);
            }

            async submitViaGitHubAPI(formData) {
                // 模拟API调用 - 实际实现需要GitHub API集成
                return new Promise((resolve) => {
                    setTimeout(() => {
                        console.log('上传处理完成');
                        resolve();
                    }, 2000);
                });
            }

            showStatus(message, type) {
                this.statusElement.textContent = message;
                this.statusElement.className = `upload-status status-${type}`;
                this.statusElement.style.display = 'block';
            }

            setupFilePreview() {
                const fileInput = document.getElementById('chapterFiles');
                const fileList = document.getElementById('fileList');
                
                fileInput.addEventListener('change', () => {
                    fileList.innerHTML = '';
                    for (let file of fileInput.files) {
                        const fileItem = document.createElement('div');
                        fileItem.className = 'file-item';
                        fileItem.textContent = `${file.name} (${this.formatFileSize(file.size)})`;
                        fileList.appendChild(fileItem);
                    }
                });
            }

            formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
        }

        // 初始化上传器
        new EnhancedUploader();
    </script>
</body>
</html>
