<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>投稿小说 - new_novels</title>
  <style>
    body { font-family: sans-serif; padding: 40px; background: #fafafa; }
    .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    input, button { display: block; width: 100%; margin: 15px 0; padding: 10px; }
    button { background: #4a90e2; color: white; border: none; cursor: pointer; border-radius: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>上传小说章节（.md 文件）</h2>
    <input type="text" id="username" placeholder="你的名字（可选）">
    <input type="file" id="fileInput" accept=".md">
    <button onclick="uploadFile()">上传到仓库</button>
    <p id="status"></p>
  </div>

  <script>
    async function uploadFile() {
      const file = document.getElementById('fileInput').files[0];
      const username = document.getElementById('username').value || '匿名投稿';
      const status = document.getElementById('status');

      if (!file) {
        status.textContent = '请选择一个 .md 文件';
        return;
      }

      const reader = new FileReader();
      reader.onload = async () => {
        const content = reader.result;
        const encoded = btoa(unescape(encodeURIComponent(content))); // base64 编码
        const filename = file.name;

        status.textContent = '正在上传...';

        try {
          const response = await fetch('https://new-novels-3j98c08le-awealys-projects.vercel.app', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              filename,
              content: encoded,
              username
            })
          });

          const result = await response.json();
          if (response.ok) {
            status.textContent = '✅ 上传成功！';
          } else {
            status.textContent = '❌ 上传失败: ' + result.message;
          }
        } catch (err) {
          status.textContent = '❌ 出错: ' + err.message;
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
