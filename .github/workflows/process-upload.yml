name: 处理小说上传

on:
  push:
    paths:
      - 'uploads/pending/**'
    branches: [main, master]
  workflow_dispatch:

jobs:
  process-uploads:
    name: 处理小说上传
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 执行上传处理
        id: process
        run: |
          python novel_upload_processor.py
          exit_code=$?
          echo "处理退出码: $exit_code"
          echo "::set-output name=exit_code::$exit_code"
          
      - name: 提交更改
        if: steps.process.outputs.exit_code == 0
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if git diff --staged --quiet; then
            echo "无更改需要提交"
          else
            git commit -m "自动处理小说上传 - $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
          
      - name: 上传处理日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-logs
          path: |
            upload_processor.log
            uploads/failed/
          retention-days: 7
