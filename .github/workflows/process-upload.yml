name: 处理小说上传

on:
  push:
    paths:
      - 'pending_uploads/**'
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write  # ✅ 允许推送

jobs:
  process-uploads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 执行上传处理
        id: process
        run: |
          python scripts/novel_upload_processor.py
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          
      - name: 提交更改
        if: steps.process.outputs.exit_code == '0'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if git diff --staged --quiet; then
            echo "无更改需要提交"
          else
            git commit -m "自动处理小说上传 [skip ci] - $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
          
      - name: 上传处理日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upload-logs
          path: |
            upload_processor.log
            uploads/failed/
          retention-days: 7
