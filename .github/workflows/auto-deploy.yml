name: 🚀 自动部署到 GitHub Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'novels/**'
      - 'scripts/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.10'

jobs:
  # 测试和验证阶段
  test-and-validate:
    name: 测试和验证
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🐍 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: 🔍 验证文件结构
        run: |
          echo "验证项目文件结构..."
          ls -la
          [ -f "scripts/generate-index.py" ] && echo "✅ generate-index.py 存在" || echo "❌ 缺少generate-index.py"
          [ -d "novels" ] && echo "✅ novels目录存在" || echo "⚠️ novels目录不存在，将创建"
          
      - name: 📊 生成小说索引
        run: |
          echo "开始生成小说索引..."
          python scripts/generate-index.py
          [ -f "novels.json" ] && echo "✅ 索引生成成功" || echo "❌ 索引生成失败"
          
      - name: 🔧 设置Node.js环境
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📦 安装依赖（如需要）
        run: |
          if [ -f "package.json" ]; then
            echo "安装项目依赖..."
            npm ci
          else
            echo "无package.json，跳过npm安装"
          fi
          
      - name: 🏗️ 构建检查
        run: |
          echo "构建检查..."
          if [ -f "index.html" ]; then
            echo "✅ index.html 存在"
          else
            # 生成基础首页
            cat > index.html << 'EOF'
            <!DOCTYPE html>
            <html lang="zh-CN">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>小说书架</title>
                <style>body{font-family: system-ui; max-width: 800px; margin: 0 auto; padding: 2rem;}</style>
            </head>
            <body>
                <h1>📚 小说书架</h1>
                <p>网站正在自动部署中，请稍后刷新...</p>
                <div id="novels-list"></div>
                <script src="js/app.js"></script>
            </body>
            </html>
            EOF
            echo "📄 已生成基础index.html"
          fi

  # 构建和部署阶段
  build-and-deploy:
    name: 构建并部署
    needs: test-and-validate
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🐍 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: 📚 生成小说索引
        run: |
          echo "生成最新小说索引..."
          python scripts/generate-index.py
          
          # 验证索引文件
          if [ -f "novels.json" ]; then
            echo "索引内容预览:"
            head -c 500 novels.json
            echo ""
            echo "索引文件大小: $(wc -c < novels.json) 字节"
          else
            echo "❌ 索引文件生成失败"
            exit 1
          fi
          
      - name: 💾 提交索引更新
        run: |
          git config --local user.name "GitHub Actions"
          git config --local user.name "GitHub Action"
          git config --local user.email "action@github.com"
          git add novels.json
          if git diff --staged --quiet; then
            echo "无索引变更需要提交"
          else
            git commit -m "自动更新小说索引 [skip ci]"
            git push
            echo "✅ 索引更新已提交"
          fi
          
      - name: ⚙️ 设置Pages
        uses: actions/configure-pages@v4
        
      - name: 📤 上传制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1
          
      - name: 🚀 部署到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 后续处理（仅在部署成功后运行）
  post-deploy:
    name: 部署后处理
    needs: build-and-deploy
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: 📊 部署状态报告
        run: |
          if needs.build-and-deploy.result == 'success'; then
            echo "🎉 部署成功！"
            echo "访问地址: ${{ needs.build-and-deploy.outputs.page_url }}"
          else
            echo "❌ 部署失败"
          fi
          
      - name: 📧 通知（可选）
        if: failure()
        run: |
          echo "可以在这里集成通知服务"
          echo "部署失败，请检查日志"
